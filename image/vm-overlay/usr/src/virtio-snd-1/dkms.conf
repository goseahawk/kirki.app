# Linux's virtio sound driver (sound/virtio in the kernel), for kirki in the kirki Mac app: macOS gives
# the virtual machine a virtio sound card, and Arch Linux ARM's kernel doesn't build its driver
# (CONFIG_SND_VIRTIO is off). DKMS builds it for every kernel that's installed or updated.
# fetch-source.sh brings the driver's code for each kernel's version. The driver is GPL-2.0+.
PACKAGE_NAME="virtio-snd"
PACKAGE_VERSION="1"
BUILT_MODULE_NAME[0]="virtio_snd"
DEST_MODULE_LOCATION[0]="/kernel/sound/virtio"
PRE_BUILD="fetch-source.sh ${kernelver}"
AUTOINSTALL="yes"
