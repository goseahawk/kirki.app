# kirki updates (kirki in the kirki Mac app)
#
# Weekly automatic updates: once a week (when not on a metered connection), the system is updated with
# pacman -Syu and Flatpak apps are updated. If Arch has posted news since your last update, you're
# asked to read it and update by hand instead.
# Set to no to turn this off, or use System Settings > System Update, or: sudo kirk-auto-update off
AUTO_SYSTEM_UPDATE=yes

# kirki releases:
# After every `sudo pacman -Syu` that upgrades something, kirki checks GitHub for a newer published
# release of the kirki Mac app and, if there is one, applies it in the background with its
# apply-to-installed.sh. Only published releases are used.
#
# Set to no to turn this off. You can still update by hand with: sudo kirk-update
AUTO_UPDATE=yes

# Where releases come from: the kirki Mac app's, which bring kirki's desktop to the virtual machine
REPO=goseahawk/kirki.app
