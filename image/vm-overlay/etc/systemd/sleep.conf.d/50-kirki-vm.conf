# In the kirki Mac app, the Mac does the sleeping: closing the lid or choosing Sleep on the Mac
# pauses kirki with everything else, and it carries on when the Mac wakes. kirki itself has nothing
# to sleep with, so Sleep and Hibernate aren't offered.
[Sleep]
AllowSuspend=no
AllowHibernation=no
AllowHybridSleep=no
AllowSuspendThenHibernate=no
