# Builds kirki's container image (kirki's desktop on linuxserver.io's webtop, Arch Linux with KDE
# Plasma), for Apple silicon (arm64) and Intel (amd64), tests it, and (optionally) publishes it:
#   - the image goes to ghcr.io/goseahawk/kirki, tagged with the version and "latest"
#   - the GitHub release gets install.sh and uninstall.sh, the commands people run in Terminal
# Run it from the Actions tab: "Release" -> "Run workflow".
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, YY.MM.DD (leave empty for today's date; a second release the same day becomes YY.MM.DD.1)"
        required: false
        default: ""
      publish:
        description: "What to do with it"
        type: choice
        default: "Just build (and test)"
        options:
          - "Just build (and test)"
          - "Publish release"
      notes:
        description: "Release notes (optional)"
        required: false
        default: ""

permissions:
  contents: write          # the tag and the release
  packages: write          # the image on ghcr.io

concurrency:
  group: release
  cancel-in-progress: false

env:
  TZ: America/New_York     # "today's date" for the version
  IMAGE: ghcr.io/goseahawk/kirki

jobs:
  version:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          PUBLISH: ${{ inputs.publish }}
          GH_TOKEN: ${{ github.token }}
        run: |
          exists() { gh release view "$1" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; }
          v="$INPUT_VERSION"
          if [[ -z $v ]]; then
            v=$(date +%y.%m.%d); n=0
            while [[ $PUBLISH == Publish* ]] && exists "$v"; do n=$((n + 1)); v="$(date +%y.%m.%d).$n"; done
          fi
          if ! [[ $v =~ ^[0-9]{2}\.[0-9]{2}\.[0-9]{2}(\.[0-9]+)?$ ]]; then
            echo "::error::Version must look like 26.11.27, got '$v'"; exit 1
          fi
          if [[ $PUBLISH == Publish* ]] && exists "$v"; then
            echo "::error::A release called $v already exists. Delete it first, or enter a different version."; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "kirki $v"

  image:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: ubuntu-24.04-arm
          - arch: amd64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Get kirki (at webtop/kirki.ref)
        run: |
          git clone -q https://github.com/goseahawk/kirki kirki
          git -C kirki checkout -q "$(cat webtop/kirki.ref)"
          git -C kirki log --oneline -1

      - name: Build the image
        run: |
          docker build -f webtop/Dockerfile --pull --build-arg KIRK_VERSION="$VERSION" \
            -t "kirki:test" .
          docker images kirki:test

      - name: Test it
        run: |
          pip install -q --break-system-packages playwright pillow && python3 -m playwright install --with-deps chromium >/dev/null \
            || echo "(no browser for the screenshot)"
          webtop/test-image.sh kirki:test test-results

      - name: Keep the test's screenshots and logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-${{ matrix.arch }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

      - name: Push
        if: ${{ startsWith(inputs.publish, 'Publish') }}
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag kirki:test "$IMAGE:$VERSION-${{ matrix.arch }}"
          docker push "$IMAGE:$VERSION-${{ matrix.arch }}"

  publish:
    needs: [version, image]
    if: ${{ startsWith(inputs.publish, 'Publish') }}
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag the image (both kinds of Mac)
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx imagetools create -t "$IMAGE:$VERSION" -t "$IMAGE:latest" \
            "$IMAGE:$VERSION-arm64" "$IMAGE:$VERSION-amd64"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
          docker logout ghcr.io
          if ! docker manifest inspect "$IMAGE:$VERSION" >/dev/null 2>&1; then
            echo "::warning::The image isn't public yet, so install.sh can't download it. Once: github.com/goseahawk?tab=packages -> kirki -> Package settings -> Change visibility -> Public."
          fi

      - name: Create the release
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          body="${NOTES:-kirki $VERSION}

          **Install:** on a Mac, open Terminal and run:

              curl -fsSL https://github.com/$GITHUB_REPOSITORY/releases/latest/download/install.sh | sh

          It sets up Docker Desktop if needed, then opens kirki in your web browser. Already using kirki?
          Run the same command to update it; your files in kirki are kept.

          Image: \`$IMAGE:$VERSION\`"
          gh release create "$VERSION" install.sh uninstall.sh --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "kirki $VERSION" --notes "$body"
