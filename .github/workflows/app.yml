# Builds and tests the kirki Mac app on every change to it (and lints the scripts). The app is
# attached to the run for 7 days. Releases are made by the Release workflow.
name: App

on:
  push:
    paths: ["app/**", "image/**", "install.sh", "apply-to-installed.sh", ".github/workflows/app.yml"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  app:
    runs-on: macos-15            # Apple silicon
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Tools
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Test
        run: swift test --package-path app

      - name: Build kirki.app
        run: KIRK_VERSION="$(date +%y.%m.%d)" app/build-app.sh

      - name: Check the app
        run: |
          plutil -p out/kirki.app/Contents/Info.plist
          file out/kirki.app/Contents/MacOS/kirki
          codesign --display --entitlements - out/kirki.app

      - uses: actions/upload-artifact@v4
        with:
          name: kirki-app
          path: out/kirki-app.zip*
          retention-days: 7

  scripts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: |
          sudo apt-get install -y -q shellcheck >/dev/null
          shellcheck -x -P image -s bash image/lib.sh image/setup.sh image/build.sh apply-to-installed.sh \
            image/vm-overlay/usr/local/bin/kirk-vm-* image/vm-overlay/usr/local/bin/kirk-setup \
            image/vm-overlay/usr/src/virtio-snd-1/fetch-source.sh
          shellcheck -s sh image/vm-overlay/usr/lib/systemd/system-shutdown/kirk-vm-power \
            image/vm-overlay/usr/local/bin/kirk-about-model
          if [ -f install.sh ]; then shellcheck -s sh install.sh && sh -n install.sh; fi
          python3 -m py_compile image/test-boot.py app/tools/make-assets.py
          for f in app/Resources/*.plist app/Resources/*.entitlements; do python3 -c "import plistlib,sys; plistlib.load(open(sys.argv[1],'rb'))" "$f"; done
          echo "All scripts check out."
